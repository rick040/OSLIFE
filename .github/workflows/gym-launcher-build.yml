name: Gym launcher build

# Builds /gym-launcher (nl.oslife.gym), the home-screen app for the wall-mounted
# gym screen, into a debug APK without Android Studio. The APK is published to
# the rolling "gym-launcher-latest" release, so the board can always download
# it from the same link (see gym-launcher/README.md).
on:
  workflow_dispatch:
  push:
    branches: [main, gym-launcher]
    paths:
      - "gym-launcher/**"
      - ".github/workflows/gym-launcher-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: gym-launcher
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner image already ships the Android SDK (ANDROID_HOME);
      # android-actions/setup-android failed on it, so it isn't used here.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk oslife-gym-launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oslife-gym-launcher-apk
          path: gym-launcher/oslife-gym-launcher.apk
          if-no-files-found: error

      # Rolling release: same download link every time, overwritten on every build.
      - name: Publish APK to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gym-launcher-latest
          name: OSLIFE gym launcher, latest APK
          body: Auto-published from the latest successful gym launcher build (commit ${{ github.sha }}). Overwritten on every build, not a versioned release.
          files: gym-launcher/oslife-gym-launcher.apk
          make_latest: false
