name: OSLIFE TWA — one-time project generation

# Manual, one-time use: generates the native Android wrapper (Trusted Web
# Activity) around the live OSLIFE web app (https://oslife-iota.vercel.app)
# and commits it to /twa, including a fixed signing key so every future
# rebuild carries the same signature (see twa-build.yml, and the walk-tracker
# app's debug.keystore fix for why that matters — a differently-signed build
# can't update in place). Re-run only if /twa needs regenerating from scratch
# (e.g. a different app identity); ordinary rebuilds use twa-build.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TWA_KEYSTORE_PASSWORD: "adeea879dcb55b4bd57d9dd37da8cd2d"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate TWA project
        run: |
          rm -rf twa
          mkdir -p twa
          TWA_BASE_URL="https://oslife-iota.vercel.app" \
          TWA_HOST="oslife-iota.vercel.app" \
          TWA_TARGET_DIR="${{ github.workspace }}/twa" \
          TWA_JDK_PATH="$JAVA_HOME" \
          TWA_KEYSTORE_PASSWORD="$TWA_KEYSTORE_PASSWORD" \
          TWA_KEY_PASSWORD="$TWA_KEYSTORE_PASSWORD" \
          node scripts/generate-twa.mjs

      - name: Wire up release signing
        run: node scripts/patch-twa-signing.mjs twa "$TWA_KEYSTORE_PASSWORD"

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add twa/
          git commit -m "Generate OSLIFE TWA project (nl.oslife.app)"
          git push
