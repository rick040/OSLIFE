name: OSLIFE widgets-only build

# Builds the standalone /android-widgets app (nl.oslife.widgets) — home-screen
# widgets only (to-do, priority, projects, brain-dump, HEYRA), no walk
# tracking — into a debug APK without needing Android Studio installed
# anywhere. Download the APK from this workflow run's Artifacts section and
# sideload it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-widgets/**"
      - ".github/workflows/widgets-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widgets
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oslife-widgets-debug-apk
          path: android-widgets/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
